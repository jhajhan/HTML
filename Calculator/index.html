<!DOCTYPE html>

<html>
    <head>
        <title>Calculator</title>
        <link rel = "stylesheet" type = "text/css" href = "style.css">
    </head>

    <body>
        <div class = "calculator">
            <div class = "input_div">
                <p id = "input_holder">  </p>
                <input id = "input_field" value = 0>
            </div>

            <div class = "memory">
                <button id = "m-clear" disabled onclick="clearMemory()">MC</button>
                <button id = "m-recall" disabled onclick="recallMemory()">MR</button>
                <button id = "m-add" onclick="addMemory()">M+</button>
                <button id = "m-subtract" onclick="subtractMemory()">M-</button>
                <button id = "m-store" onclick="storeMemory()">MS</button>
                <select id = "memory" disabled>
                    <option>M</option>
                </select>
                <div id = "memory-display"></div>
            </div>

            <div class = "row">
                <button id = "percent" value = "%" onclick="operation(this)">%</button>
                <button id = "ce" onclick = "clearEntry()">CE</button>
                <button id = "c" onclick = "clearAll()">C</button>
                <button id = "erase" onclick = "erase()">⌫</button>
            </div>

            <div class = "row">
                <button id = "bin" onclick="convertBetweenBases(2)">BIN</button>
                <button id = "oct" onclick="convertBetweenBases(8)">OCT</button>
                <button id = "hex"  onclick="convertBetweenBases(16)">HEX</button>
                <button id = "divi" value = "÷" onclick = "operation(this)">/</button>
            </div>

            <div class = "row">
                <button id = "seven" value="7" onclick="showNumber(this)">7</button>
                <button id = "eight" value="8" onclick="showNumber(this)">8</button>
                <button id = "nine" value="9" onclick="showNumber(this)">9</button>
                <button id = "mul" value = "×" onclick = "operation(this)">x</button>
            </div>

            <div class = "row">
                <button id = "four" value="4" onclick="showNumber(this)">4</button>
                <button id = "five" value="5" onclick="showNumber(this)">5</button>
                <button id = "six" value="6" onclick="showNumber(this)">6</button>
                <button id = "sub" value = "-" onclick = "operation(this)">-</button>
            </div>

            <div class = "row">
                <button id = "one" value="1" onclick="showNumber(this)">1</button>
                <button id = "two" value="2" onclick="showNumber(this)">2</button>
                <button id = "three" value="3" onclick="showNumber(this)">3</button>
                <button id = "add" value = "+" onclick = "operation(this)">+</button>
            </div>

            <div class = "row">
                <button id = "pos-neg" onclick="posNeg()">+/-</button>
                <button id = "zero" value = "0" onclick="showNumber(this)">0</button>
                <button id = "point" value = "." onclick="showNumber(this)">.</button>
                <button id = "equal" onclick = "equals(true)">=</button>
            </div>
        </div>

        <script>

            let operand_holder = 0;
            let operator_holder = ""; // to store current operator
            let equals_holder = 0; // to store current result
            let memory = [];
            let anotherOperand = false;
            let previousBaseUsed = 0;
            let isEquals = false;
            let isDecimal = true;
            


            function showNumber(number) {

                let digit = number.getAttribute('value');
                let input_field_value = document.getElementById('input_field').value;

                console.log(digit);

                if (digit == ".") {
                    if (input_field_value.includes(".")) { //to ensure only one point can be typed
                        return;
                    }
                }
                

                if (input_field_value == 0 || anotherOperand) { // if a number is not yet typed or another operand is typed
                    document.getElementById('input_field').value = digit;
                    anotherOperand = false;

                    
                } else {
                    document.getElementById('input_field').value += digit;
                }       
            }

            function erase() {
                let input_field = document.getElementById('input_field');

                if (equals_holder != 0) {
                    document.getElementById('input_holder').textContent = "";
                    equals_holder = 0;

                } else {
                    input_field.value = input_field.value.substring(0, input_field.value.length - 1);
                }

                if (input_field.value.length == 0) {
                    input_field.value = "0";
                    previousBaseUsed = 0;
                }
            }


            function clearAll() {
                document.getElementById('input_field').value = "0";
                document.getElementById('input_holder').textContent = "";
                operand_holder = 0;
                operator_holder = "";
                equals_holder = 0;
                previousBaseUsed = 0;
    
            }

            function clearEntry () {
                document.getElementById('input_field').value = "0";
                if (isEquals) {
                    document.getElementById('input_holder').textContent = "";
                }

                previousBaseUsed = 0;
            }

            function operation(operator) {

                let operand = document.getElementById('input_field').value;   
                
                if (operator.value == "%") {
                    console.log('hello');
                    operator_holder = operator.value;
                    operand_holder = operand;
                    equals(true);
                    document.getElementById('input_holder').textContent = operand + " " + operator.value;
                    return;
                }

                if (operator_holder != "") { // if operator is not the first
                    equals(false); 
                    operator_holder = operator.value;
                    document.getElementById('input_holder').textContent = equals_holder + " " + operator_holder;
                    anotherOperand = true; // another operand is to be typed            
                    return;
                }

                

                operand_holder = operand;
                operator_holder = operator.value;
                document.getElementById('input_holder').textContent = operand + " " + operator.value;
                anotherOperand = true; // another operand is to be typed 
                isEquals = false;

            }

            function equals (isFirstOperator) {
                let operand = document.getElementById('input_field').value;
 
                if (isFirstOperator && operator_holder != "%") {
                    document.getElementById('input_holder').textContent += " " + operand + " =";
                }

                console.log(operator_holder);
                console.log(operand_holder);

                switch(operator_holder) {
                    case "+": equals_holder = operand_holder = document.getElementById('input_field').value = parseFloat(operand_holder) + parseFloat(operand); operator_holder = ""; isEquals = true; break;
                    case "-": equals_holder = operand_holder = document.getElementById('input_field').value = parseFloat(operand_holder) - parseFloat(operand); operator_holder = ""; isEquals = true; break;
                    case "×": equals_holder = operand_holder = document.getElementById('input_field').value = parseFloat(operand_holder) * parseFloat(operand); operator_holder = ""; isEquals = true; break;;
                    case "÷": equals_holder = operand_holder = document.getElementById('input_field').value = parseFloat(operand_holder) / parseFloat(operand); operator_holder = ""; isEquals = true; break;
                    case "%": equals_holder = operand_holder = document.getElementById('input_field').value = parseFloat(operand_holder) / 100; console.log('yow'); break;
                }
            }

            function isValidInput(input, base) {
                const basePatterns = {
                    2: /^[01]+(\.[01]+)?$/,         // Binary
                    8: /^[0-7]+(\.[0-7]+)?$/,       // Octal
                    10: /^[0-9]+(\.[0-9]+)?$/,      // Decimal
                    16: /^[0-9A-Fa-f]+(\.[0-9A-Fa-f]+)?$/ // Hexadecimal
                };

                const pattern = basePatterns[base];
                return pattern ? pattern.test(input) : false;
    }

            function convertBetweenBases(toBase) {
                let input_field = document.getElementById('input_field');
                let input_field_value = input_field.value.trim(); 
            

                if (previousBaseUsed == 0) {
                    fromBase = 10;
                } else {
                    fromBase = previousBaseUsed;
                }

                if (!isValidInput(input_field_value, fromBase)) {
                    input_field.value = 'INVALID';
                    return;
                }

                if (input_field_value.includes(".")) {
                    input_field.value = convertFloatingPoint(input_field_value, fromBase, toBase);
                } else {
                    input_field.value = parseInt(input_field_value, fromBase).toString(toBase).toUpperCase();
                }

                previousBaseUsed = toBase;
                    
            }

            function convertFloatingPoint(input, fromBase, toBase) {
                // Split input into integer and fractional parts
                let [integerPart, fractionalPart] = input.split('.');
                
                // Parse the integer part
                let integerResult = parseInt(integerPart, fromBase).toString(toBase);

                // Parse the fractional part manually
                let fractionalResult = '';
                if (fractionalPart) {
                    let fraction = 0;
                    
                    // Calculate fractional value
                    for (let i = 0; i < fractionalPart.length; i++) {
                        fraction += parseInt(fractionalPart[i], fromBase) / Math.pow(fromBase, i + 1);
                    }

                    // Convert fractional part to target base
                    fractionalResult = '.';
                    while (fraction > 0 && fractionalResult.length <= 10) { // Precision control
                        fraction *= toBase;
                        let digit = Math.floor(fraction);
                        fractionalResult += digit.toString(toBase);
                        fraction -= digit;
                    }
                }

                // Combine integer and fractional parts
                return (integerResult + fractionalResult).toUpperCase();
            }


            function storeMemory() {
                memory.push(parseFloat(document.getElementById('input_field').value));
                document.getElementById("memory").disabled = false;
                document.getElementById("m-clear").disabled = false;
                document.getElementById("m-recall").disabled = false;
                console.log(memory[0]);

                updateMemory();
            }

            function addMemory() {
                memory[memory.length - 1] += parseFloat(document.getElementById('input_field').value);
                updateMemory();
            }

            function subtractMemory() {
                memory[memory.length - 1] -= parseFloat(document.getElementById('input_field').value);
                updateMemory();
            }

            function recallMemory() {
                document.getElementById('input_field').value = memory[memory.length - 1];
            }

            function clearMemory() {
                memory = [];
                document.getElementById("memory").disabled = true;
                document.getElementById("m-clear").disabled = true;
                document.getElementById("m-recall").disabled = true;
            }

            function updateMemory() {
                let memoryDisplay = document.getElementById("memory");
                memoryDisplay.innerHTML = "";
                memoryDisplay.add(new Option('M'));

                for (let i = memory.length - 1; i >= 0; i--) {
                    memoryDisplay.add(new Option(memory[i]));
                }
            }

            function posNeg() {
                const input_field = document.getElementById('input_field');
                const value = parseFloat(input_field.value); // Get numeric value
                input_field.value = -value; 
            }

        
            
        </script>
    </body>
</html>
