<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Playfair+Display&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel = "icon" type = "image/x-icon" href = "img/logo.png">
        <title>Registration Form</title>
    </head>

    <body>
        <div class = "regform-wrapper">
            <h1>Cavite Crocheter Club</h1>
            <h3>Registration Form</h3>

            <form action = "#" method = "post">
                <section class = "personal-details">
                    <h4>Personal Details</h4>
                    <div class = "name">
                        <label for = "fname">First Name</label>
                        <input type = "text" id = "fname" class = "fname" required>
                        <label for = "lname">Last Name</label>
                        <input type = "text" id = "lname" class = "lname" required>
                    </div>
                    
            
                    <div class = "birthday">
                        <label for = "bday">Birthday</label>
                        <input type = "date" id = "bday" class = "bday" required>  
                    </div>
                        
                    <div class = "gender-container">
                        <label for = "gender">Gender</label>                  
                        <input type = "radio" id = "female" name = "gender" value = "Female">
                        <label for = "female">Female</label>
                        <input type = "radio" id = "male" name = "gender" value = "Male">
                        <label for = "male">Male</label>
                        <input type = "radio" id = "na" name = "gender" value = "Na">
                        <label for = "na">Prefer not to say</label>
                    </div>
                </section>

                <section class = "address-information">
                    <h4>Address Information</h4>

                        <label for = "city">City</label>
                        <select id = "city" name = "city" required>
                        </select>
    
                        <label for = "barangay">Barangay</label>
                        <select id = "barangay" name = "barangay" required></select>
    
                        <label for = "street-address">Street Address</label>
                        <input type = "text" id = "street-address" class = "street-address" required>
                           
                </section>

                <section class = "contact-information">
                    <h4>Contact Information</h4>

                    <div class = "contact">
                        <label for = "contactno">Contact Number</label>
                        <input type = "text" id = "contactno" class = "contactno" required>
                        <label for = "email">Email</label>
                        <input type = "text" id = "email" class = "email" required>
                    </div>
                </section>

                <section class = "crochet-experience">
                    <h4>Crochet Experience</h4>

                    <div class = "experience-level">
                        <label for = "beginner">Experience Level</label>                  
                        <input type = "radio" id = "beginner" name = "experience" value = "Beginner">
                        <label for = "beginner">Beginner</label>
                        <input type = "radio" id = "intermediate" name = "experience" value = "Intermediate">
                        <label for = "intermediate">Intermediate</label>
                        <input type = "radio" id = "Advanced" name = "advanced" value = "Advanced">
                        <label for = "advanced">Advanced</label>
                    </div>

                    <div class = "works">
                        <label for="works">Crochet Works You Specialize In:</label><br>
                        <input type="checkbox" id="bags" name="works" value="bags">
                        <label for="bags">Bags</label><br>
                        <input type="checkbox" id="hats" name="works" value="hats">
                        <label for="hats">Hats</label><br>
                        <input type="checkbox" id="clothes" name="works" value="clothes">
                        <label for="clothes">Clothes</label><br>
                        <input type="checkbox" id="amigurumi" name="works" value="amigurumi">
                        <label for="amigurumi">Amigurumi (Crocheted Toys)</label><br>
                        <input type="checkbox" id="home-decor" name="works" value="home-decor">
                        <label for="home-decor">Home Decor (Pillows, Wall Hangings)</label><br>
                        <input type="checkbox" id="accessories" name="works" value="accessories">
                        <label for="accessories">Accessories (Scarves, Gloves, Headbands)</label><br>
                        <input type="checkbox" id="blankets" name="works" value="blankets">
                        <label for="blankets">Blankets</label><br>
                    </div>
                </section>

                <section class = "additional-information">
                    <h4>Additional Information</h4>
                    <div class = "social-media">
                        <label for = "fb">Facebook</label>
                        <input type = "text" class = "fb">
                        <label for = "ig">Instagram</label>
                        <input type = "text" class = "ig">
                    </div>

                    <div class = "referral">
                        <label for = "ref">How did you hear about us?</label>
                        <input type = "text" class = "ref">
                    </div>
                </section>

                <section class = "membership-agreement">
                    <h4>Membership Agreement</h4>
                    
                    <div class = "agreement">
                        <input type = "checkbox" class = "agree-checkbox" required>
                        <label for = "agree-checkbox">I agree to the clubs <a href = "#"> rules and guidelines.</a></label>
                    </div>
                </section>

                <input type = "submit" value = "Register" name = "Register"> 


            </form>
        </div>

        <script src = "app.js"></script>
    </body>
</html>
