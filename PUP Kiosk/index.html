            <div class = "kiosktitle"><p>Hover over the area to see information</p></div>
        </div>

        <script>
            let infoBox = document.getElementById('info-box');
            
            function showInfo (event, area) {
                const title = area.getAttribute('title');
                const info = area.getAttribute('data-info');
                const img = area.getAttribute('data-img')
                infoBox.innerHTML = `
                <h4>${title}</h4>
                <div class = 'info-dets'><img src = "${img}">
                <p>${info}</p></div>`;

              // Adjust the position relative to the cursor
                infoBox.style.top = (event.pageY - 25) + 'px'; // Adjust the position relative to the cursor
                infoBox.style.left = (event.pageX - 380) + 'px';
                infoBox.style.display = 'block';

            }

            function hideInfo(){
                infoBox.style.display = 'none';
            }
        </script>
    </body>

</html>
