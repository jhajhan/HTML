        <script>
            let infoBox = document.getElementById('info-box');
            
            function showInfo (event, area) {
                const title = area.getAttribute('title');
                const info = area.getAttribute('data-info');
                const img = area.getAttribute('data-img')
                infoBox.innerHTML = `
                <h4>${title}</h4>
                <div class = 'info-dets'><img src = "${img}">
                <p>${info}</p></div>`;

                infoBox.style.display = 'block';
                infoBox.style.left = `${event.pageX - infoBox.offsetHeight - 10}px`
                infoBox.style.top = `${event.pageY - 100}px`;
            }

            function hideInfo(){
                infoBox.style.display = 'none';
            }
        </script>
