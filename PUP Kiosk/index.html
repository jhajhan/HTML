            <div class = "kiosktitle"><p><b><i>Hover over the area to see information</i></b></p></div></div>

            <div class = 'info-box' id = 'info-box'></div>
        </div>

        <script>
            let infoBox = document.getElementById('info-box');
            
            function showInfo (event, area) {
                const name = area.getAttribute('name');
                const info = area.getAttribute('data-info');
                const img = area.getAttribute('data-img')
                infoBox.innerHTML = `
                <h4>${name}</h4>
                <div class = 'info-dets'><img src = "${img}">
                <p>${info}</p></div>`;

              // Adjust the position relative to the cursor
                infoBox.style.top = (event.pageY - 15) + 'px'; // Adjust the position relative to the cursor
                infoBox.style.left = (event.pageX - 50) + 'px';
                infoBox.style.display = 'block';

            }

            function hideInfo(){
                infoBox.style.display = 'none';
            }
        </script>
    </body>

</html>
